name: aerial_localsend
description: LocalSend Flutter experience packaged as an add-to-app module for Aerial TV.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  localsend_app:
    path: ../app

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

module:
  androidX: true
  androidPackage: org.localsend.aerial_module
  iosBundleIdentifier: org.localsend.aerialModule
